services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: ${DOCKER_IMAGE:-careplate:latest}
        container_name: careplate_app
        restart: unless-stopped
        ports:
            - '127.0.0.1:${APP_PORT:-8001}:80'
        env_file:
            - .env
        environment:
            DB_HOST: db
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        volumes:
            - careplate_storage:/var/www/html/storage/app/public
        depends_on:
            - db
            - redis
        networks:
            - careplate_network

    db:
        image: mysql:8.0
        container_name: careplate_db
        restart: unless-stopped
        entrypoint:
            - bash
            - -c
            - |
                if [ "$$DB_USERNAME" = "root" ] || [ -z "$$DB_USERNAME" ]; then
                    unset MYSQL_USER
                    unset MYSQL_PASSWORD
                else
                    export MYSQL_USER="$$DB_USERNAME"
                    export MYSQL_PASSWORD="$$DB_PASSWORD"
                fi
                exec /entrypoint.sh mysqld
        environment:
            DB_USERNAME: '${DB_USERNAME:-root}'
            DB_PASSWORD: '${DB_PASSWORD:-careplate_password}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-${DB_PASSWORD:-root_password}}'
            MYSQL_DATABASE: '${DB_DATABASE:-careplate}'
        volumes:
            - careplate_db_data:/var/lib/mysql
        networks:
            - careplate_network

    redis:
        image: redis:alpine
        container_name: careplate_redis
        restart: unless-stopped
        volumes:
            - careplate_redis_data:/data
        networks:
            - careplate_network

volumes:
    careplate_db_data:
    careplate_redis_data:
    careplate_storage:

networks:
    careplate_network:
        driver: bridge
